<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal Combat Engine</title>
    <style>
        :root {
            --term-green: #0f0;
            --term-dark: #050505;
            --hp-high: #0f0;
            --hp-med: #ff0;
            --hp-low: #f00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--term-dark);
            color: var(--term-green);
            font-family: 'Courier New', Courier, monospace;
            height: 100dvh; /* 避免手機網址列遮擋 */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* CRT 螢幕掃描線濾鏡 */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none; /* 確保點擊穿透 */
            z-index: 100;
        }

        /* 前言畫面 */
        #prologue {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--term-dark);
            z-index: 50;
            padding: 20px;
            text-align: center;
        }

        .prologue-img {
            max-width: 200px;
            max-height: 200px;
            object-fit: contain;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .prologue-img.show { opacity: 1; }
        .glow-green { filter: drop-shadow(0 0 15px var(--term-green)); }
        .glow-red { filter: drop-shadow(0 0 20px #f00) hue-rotate(320deg); }

        /* 遊戲主體 */
        #game-ui {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* 戰鬥區 (上) */
        #battle-area {
            flex: 1;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            border-bottom: 2px solid var(--term-green);
        }

        .character {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
        }

        .char-img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        #player-img {
            transform: scaleX(-1); /* 玩家面向右 */
            filter: drop-shadow(0 0 5px var(--term-green));
        }

        #enemy-img {
            filter: drop-shadow(0 0 15px #f00);
        }

        /* 血條設計 */
        .status-box { width: 100%; text-align: center; font-weight: bold; }
        .hp-bar-container {
            width: 100%; height: 20px;
            border: 1px solid var(--term-green);
            margin-top: 5px;
            background: #111;
        }
        .hp-bar {
            height: 100%; width: 100%;
            background-color: var(--hp-high);
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* 終端機對話框 (下) */
        #terminal-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            background: #000;
        }

        /* 指令按鈕區置頂防遮擋 */
        #controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            background: #000;
            color: var(--term-green);
            border: 1px solid var(--term-green);
            padding: 15px 5px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) { background: var(--term-green); color: #000; }
        button:disabled { border-color: #333; color: #555; cursor: not-allowed; }

        /* 文字紀錄區 */
        #log {
            flex: 1;
            overflow-y: auto;
            border: 1px dashed #333;
            padding: 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ===== RWD 手機版設定 ===== */
        @media (max-width: 768px) {
            #battle-area {
                flex-direction: column; /* 魔王在上，學員在下 */
            }
            .character { width: 80%; margin: 10px 0; }
            .char-img { width: 100px; height: 100px; }
            #controls { grid-template-columns: 1fr 1fr; } /* 確保是 2x2 */
        }

        /* ===== 動畫 Keyframes ===== */
        /* 電腦版水平衝刺 */
        @keyframes dashRight { 0% { transform: scaleX(-1) translateX(0) scale(1); } 50% { transform: scaleX(-1) translateX(100px) scale(1.2); } 100% { transform: scaleX(-1) translateX(0) scale(1); } }
        @keyframes dashLeft { 0% { transform: translateX(0) scale(1); } 50% { transform: translateX(-100px) scale(1.2); } 100% { transform: translateX(0) scale(1); } }
        
        /* 手機版垂直衝刺 */
        @keyframes dashUp { 0% { transform: scaleX(-1) translateY(0) scale(1); } 50% { transform: scaleX(-1) translateY(-80px) scale(1.2); } 100% { transform: scaleX(-1) translateY(0) scale(1); } }
        @keyframes dashDown { 0% { transform: translateY(0) scale(1); } 50% { transform: translateY(80px) scale(1.2); } 100% { transform: translateY(0) scale(1); } }

        /* 受擊亂碼 */
        @keyframes glitchHit {
            0% { transform: translate(0) scaleX(var(--facing, 1)); filter: invert(0); }
            20% { transform: translate(-10px, 5px) skew(-10deg) scaleX(var(--facing, 1)); filter: invert(1) hue-rotate(90deg); }
            40% { transform: translate(10px, -5px) skew(10deg) scaleX(var(--facing, 1)); filter: brightness(2); }
            60% { transform: translate(-5px, 5px) skew(0) scaleX(var(--facing, 1)); filter: invert(1); }
            100% { transform: translate(0) scaleX(var(--facing, 1)); filter: invert(0); }
        }

        /* 戰敗掉落 */
        @keyframes fallDefeat {
            0% { transform: translateY(0) scaleX(var(--facing, 1)); opacity: 1; filter: grayscale(0); }
            100% { transform: translateY(200px) scaleX(var(--facing, 1)); opacity: 0; filter: grayscale(1); }
        }

        /* 動畫 Class */
        .anim-dash-player-pc { animation: dashRight 0.3s ease-out; }
        .anim-dash-enemy-pc { animation: dashLeft 0.3s ease-out; }
        .anim-dash-player-mobile { animation: dashUp 0.3s ease-out; }
        .anim-dash-enemy-mobile { animation: dashDown 0.3s ease-out; }
        .anim-glitch { animation: glitchHit 0.4s steps(2); }
        .anim-fall { animation: fallDefeat 1.5s forwards; }

    </style>
</head>
<body>
    <div class="crt-overlay"></div>

    <div id="prologue">
        <img id="prologue-img" class="prologue-img glow-green" src="https://raw.githubusercontent.com/xcf1026-glitch/2d1/main/%E6%88%90%E9%83%BD%E8%B6%85%E4%BA%BA-removebg-preview.png" alt="Player">
        <div id="prologue-text"></div>
    </div>

    <div id="game-ui">
        <div id="battle-area">
            <div class="character" id="enemy-char">
                <img id="enemy-img" class="char-img" src="https://raw.githubusercontent.com/xcf1026-glitch/2d1/main/%E4%B8%8B%E8%BC%89-removebg-preview%20(2).png" alt="Enemy" style="--facing: 1;">
                <div class="status-box">
                    <div>Malware [Lv.99]</div>
                    <div class="hp-bar-container"><div id="enemy-hp-bar" class="hp-bar"></div></div>
                    <div id="enemy-hp-text">10000 / 10000</div>
                </div>
            </div>
            <div class="character" id="player-char">
                <img id="player-img" class="char-img" src="https://raw.githubusercontent.com/xcf1026-glitch/2d1/main/%E6%88%90%E9%83%BD%E8%B6%85%E4%BA%BA-removebg-preview.png" alt="Player" style="--facing: -1;">
                <div class="status-box">
                    <div>SysAdmin [Lv.1]</div>
                    <div class="hp-bar-container"><div id="player-hp-bar" class="hp-bar"></div></div>
                    <div id="player-hp-text">150 / 150</div>
                </div>
            </div>
        </div>

        <div id="terminal-area">
            <div id="controls">
                <button id="btn-attack" onclick="playerAction('attack')">std::attack()</button>
                <button id="btn-rm" onclick="playerAction('rm')">sudo rm -rf /<br><span id="cd-rm">(Ready)</span></button>
                <button id="btn-ctrlc" onclick="playerAction('ctrlc')">Ctrl+C<br><span id="cd-ctrlc">(Ready)</span></button>
                <button id="btn-heal" onclick="playerAction('heal')">debug_heal()</button>
            </div>
            <div id="log"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
